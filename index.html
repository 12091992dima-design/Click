<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Freerobux Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .header {
            padding-top: 20px;
            text-align: center;
        }
        .balance-container {
            font-size: 28px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .robux-icon {
            color: #00b0ff;
        }
        .clicker-area {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        .tap-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00b0ff, #0077ff);
            border: none;
            box-shadow: 0 10px 30px rgba(0, 176, 255, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            transition: transform 0.1s ease;
            outline: none;
        }
        .tap-button:active {
            transform: scale(0.92);
        }
        .footer {
            padding-bottom: 30px;
            font-size: 14px;
            color: #8c9ba5;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-container">
            <span class="robux-icon">🪙</span>
            <span id="score">0</span> RBX
        </div>
    </div>

    <div class="clicker-area">
        <button class="tap-button" id="clickBtn">💎</button>
    </div>

    <div class="footer">
        Тапай и собирай робуксы!
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = localStorage.getItem('robux_score') ? parseInt(localStorage.getItem('robux_score')) : 0;
        const scoreElement = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');

        scoreElement.innerText = score;

        clickBtn.addEventListener('click', () => {
            score += 10;
            scoreElement.innerText = score;
            localStorage.setItem('robux_score', score);
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>
</body>
</html>
